# Use DecapBridge PKCE auth (required)
backend:
  name: git-gateway
  repo: rodrig011/pyh
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/b75698a4-cb57-457b-8e0e-40b60c39e346/pkce
  auth_token_endpoint: /sites/b75698a4-cb57-457b-8e0e-40b60c39e346/token
  gateway_url: https://gateway.decapbridge.com

  # See who did what (optional)
  commit_messages:
    create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Enable PKCE fields (optional, recommended)
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

# Better Decap + Bridge logo (optional)
logo_url: /images/brand/wordmark.svg

# Add site links in Decap CMS (optional)
site_url: https://sofisticated.lat

publish_mode: simple
media_folder: "src/images/uploads"
public_folder: "/images/uploads"

locale: "es"

collections:
  - name: "posts"
    label: "Posts del blog"
    label_singular: "Post"
    folder: "src/posts"
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{title}} — {{date}}"
    sortable_fields: ["date", "title"]
    fields:
      - { label: "Título del post", name: "title", widget: "string", required: false }
      - label: "Categoría"
        name: "category"
        widget: "select"
        required: false
        options:
          - "Ingredients"
          - "Formulation"
          - "Skin Science"
          - "Naturals"
          - "Color Cosmetics"
          - "INCI Decoded"
          - "Actives"
      - label: "Resumen corto"
        name: "excerpt"
        widget: "text"
        required: false
        hint: "1-2 frases. Esto se muestra en la tarjeta del post en la página principal"
      - label: "Imagen de portada"
        name: "image"
        widget: "image"
        required: false
        hint: "Arrastra una imagen aquí o haz clic para subirla"
      - label: "Fecha de publicación"
        name: "date"
        widget: "datetime"
        format: "yyyy-MM-dd"
        required: false
      - label: "Contenido del post"
        name: "body"
        widget: "markdown"
        required: false
        hint: "Aquí escribes el post completo. Para AGRANDAR un texto: selecciónalo y dale a uno de los botones H1 a H6 de la barra de arriba (H1 = el más grande, H6 = apenas más grande que lo normal). También hay negritas, cursivas, listas, links e imágenes."

  - name: "settings"
    label: "Configuración del sitio"
    files:
      - name: "general"
        label: "Contenido general"
        file: "src/_data/site.json"
        fields:
          - label: "Nombre del sitio"
            name: "title"
            widget: "string"
            required: false
            hint: "Aparece en la pestaña del navegador y cuando compartes el link"

          - label: "Tamaño del texto"
            name: "text_size"
            widget: "select"
            required: false
            default: "normal"
            options:
              - { label: "Normal", value: "normal" }
              - { label: "Grande", value: "grande" }
              - { label: "Más grande", value: "xl" }
            hint: "Agranda el texto de lectura de todo el sitio. Los títulos grandes y el menú no cambian."

          - label: "Portada"
            name: "hero"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Título grande", name: "title", widget: "string", required: false, hint: "Corto: que quepa en dos renglones (unas 35 letras)." }
              - { label: "Frase debajo del título", name: "sentence", widget: "text", required: false }
              - { label: "Texto del botón", name: "button_text", widget: "string", required: false, hint: "El botón lleva al decodificador de etiquetas." }
              - { label: "Foto del panel fijo (opcional)", name: "photo", widget: "image", required: false, hint: "Vertical. Si la dejas vacía se usa el polvo rosa con el logo." }
              - { label: "Texto abajo a la izquierda del panel", name: "note_left", widget: "string", required: false }
              - { label: "Texto abajo a la derecha del panel", name: "note_right", widget: "string", required: false }

          - label: "Presentación (columna de texto bajo la portada)"
            name: "intro"
            widget: "object"
            collapsed: true
            fields:
              - label: "Párrafos"
                name: "paragraphs"
                widget: "list"
                required: false
                field: { label: "Párrafo", name: "p", widget: "text" }
                hint: "Cuatro párrafos cortos funcionan mejor. El primero sale en negrita."

          - label: "Decodificador de etiquetas"
            name: "decoder"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Título", name: "title", widget: "string", required: false }
              - { label: "Frase", name: "sentence", widget: "text", required: false }

          - label: "Carta de Sofia (Sobre mí)"
            name: "about"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Foto circular", name: "photo", widget: "image", required: false, hint: "Cuadrada o vertical, se recorta en círculo." }
              - label: "Carta"
                name: "letter"
                widget: "markdown"
                required: false
                hint: "El primer párrafo sale grande (como un saludo). Lo que pongas en **negrita** se resalta en rosa."
              - { label: "Firma", name: "name", widget: "string", required: false }
              - { label: "Debajo de la firma", name: "role", widget: "string", required: false }

          - label: "Fotos de Instagram"
            name: "instagram"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Título de la sección", name: "title", widget: "string", required: false }
              - label: "Fotos"
                name: "images"
                widget: "list"
                required: false
                hint: "Sube entre 5 y 9 fotos. La sección no aparece en la web mientras esta lista esté vacía."
                fields:
                  - { label: "Foto", name: "src", widget: "image", required: false }
                  - { label: "Descripción corta (para accesibilidad)", name: "alt", widget: "string", required: false }

          - label: "Redes sociales y contacto"
            name: "social"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Link de Instagram", name: "instagram_url", widget: "string", required: false }
              - { label: "Usuario de Instagram (@...)", name: "instagram_handle", widget: "string", required: false }
              - { label: "Link de LinkedIn", name: "linkedin_url", widget: "string", required: false }
              - { label: "Correo de contacto", name: "email", widget: "string", required: false }

          - label: "Newsletter"
            name: "newsletter"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Título", name: "title", widget: "string", required: false }
              - { label: "Texto", name: "subtitle", widget: "text", required: false }
              - { label: "Texto del botón", name: "button_text", widget: "string", required: false }
              - { label: "Nota pequeña abajo", name: "note", widget: "string", required: false }
              - { label: "Mensaje al suscribirse", name: "success", widget: "string", required: false }
              - label: "Enlace del formulario (Brevo)"
                name: "form_action"
                widget: "string"
                required: false
                hint: "Opcional. Mientras esté vacío, las suscripciones se guardan solas en Netlify (panel de Netlify → Forms → newsletter). Si conectas Brevo, pega aquí la URL de tu formulario (Contacts → Forms → integración HTML → copia la URL que dice action=\"...sibforms.com/serve/...\") y el botón pasará a mandar los correos directo a tu lista de Brevo."

          - label: "Pie de página"
            name: "footer"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Texto de copyright", name: "copyright", widget: "string", required: false }
